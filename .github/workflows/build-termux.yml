name: Build wrapper (Termux packages, aarch64 Android)

on:
  workflow_dispatch:
  push:
    branches: [ fristonerr-wrapper-v1 ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Frist wrapper source (with BCn patch)
        uses: actions/checkout@v4
        with:
          path: frist-src

      - name: Clone termux-packages build system
        run: |
          git clone --depth 1 https://github.com/leegao/vulkan_wrapper_termux-packages.git tp
          # Place Frist source where termux-packages expects it
          rm -rf tp/mesa_bionic
          cp -r frist-src tp/mesa_bionic

      - name: Apply BCn-off patch to mesa_bionic
        run: |
          cd tp/mesa_bionic
          python3 - <<'PY'
          p='src/vulkan/wrapper/wrapper_physical_device.c'
          s=open(p).read()
          old='''      pdevice->needs_bc1_emulation = !pdevice->base_supported_features.textureCompressionBC && !has_bc1_support(pdevice);
      pdevice->needs_bc4_emulation = !pdevice->base_supported_features.textureCompressionBC && !has_bc4_support(pdevice);'''
          new='''      /* Default BCn emulation OFF (mask 0x0000). Re-enable with FORCE_BCN_EMULATION=1. */
      pdevice->needs_bc1_emulation = false;
      pdevice->needs_bc4_emulation = false;'''
          assert old in s, "BCn lines not found"
          s=s.replace(old,new)
          open(p,'w').write(s)
          print("patched")
          PY

      - name: Build leegao SPIRV-Tools (aarch64 static libs)
        run: |
          set -e
          git clone --depth 1 --recurse-submodules --shallow-submodules \
            https://github.com/leegao/SPIRV-Tools.git /tmp/SPIRV-Tools
          cd /tmp/SPIRV-Tools
          sed -i 's/ -Werror//g' Android.mk
          mkdir -p build/libs build/app jni
          printf 'LOCAL_PATH := $(call my-dir)\ninclude $(LOCAL_PATH)/../Android.mk\n' > jni/Android.mk
          NDK=/usr/local/lib/android/sdk/ndk/$(ls /usr/local/lib/android/sdk/ndk | grep '^27' | head -1)
          "$NDK/ndk-build" -j"$(nproc)" -C /tmp/SPIRV-Tools \
            NDK_PROJECT_PATH=/tmp/SPIRV-Tools \
            NDK_LIBS_OUT=/tmp/SPIRV-Tools/build/libs \
            NDK_APP_OUT=/tmp/SPIRV-Tools/build/app \
            APP_ABI=arm64-v8a APP_PLATFORM=android-26
          find /tmp/SPIRV-Tools/build -name '*.a'

      - name: Stage SPIRV-Tools into mesa_bionic
        run: |
          set -e
          mkdir -p tp/mesa_bionic/src/vulkan/wrapper/lib
          rm -f tp/mesa_bionic/src/vulkan/wrapper/lib/*.a
          if ls /tmp/SPIRV-Tools/build/app/local/arm64-v8a/*.a >/dev/null 2>&1; then
            cp /tmp/SPIRV-Tools/build/app/local/arm64-v8a/*.a tp/mesa_bionic/src/vulkan/wrapper/lib/
          else
            cp /tmp/SPIRV-Tools/build/libs/arm64-v8a/*.a tp/mesa_bionic/src/vulkan/wrapper/lib/
          fi
          rm -rf tp/mesa_bionic/src/vulkan/wrapper/include/spirv-tools
          cp -r /tmp/SPIRV-Tools/include tp/mesa_bionic/src/vulkan/wrapper/include/spirv-tools
          ls -la tp/mesa_bionic/src/vulkan/wrapper/lib

      - name: Build wrapper via termux-packages
        run: |
          set -e
          cd tp
          # run-docker.sh needs the package builder image
          sudo ./scripts/run-docker.sh sudo bash -c '
            NDK=/home/builder/lib/android-ndk-r27c
            cd /home/builder/termux-packages
            export TERMUX_TOPDIR=/home/builder/.termux-build
            ./build-package.sh --library bionic vulkan-wrapper-android -s -f
          ' 2>&1 | tail -40

      - name: Extract built .so
        run: |
          set -e
          find / -name "libvulkan_wrapper.so" 2>/dev/null
          cp $(find / -path "*vulkan-wrapper-android/build/src/vulkan/wrapper/libvulkan_wrapper.so" 2>/dev/null | head -1) ./libvulkan_wrapper.so
          ls -la libvulkan_wrapper.so

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: libvulkan_wrapper-termux
          path: libvulkan_wrapper.so
          if-no-files-found: error
