name: Build wrapper (API24, no RELR - matches Frist 2.0)

on:
  workflow_dispatch:
  push:
    branches: [ fristonerr-wrapper-v1 ]
    paths:
      - '.github/workflows/build-fix24.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Frist wrapper source (with BCn patch)
        uses: actions/checkout@v4

      - name: Build SPIRV-Tools static libs (aarch64)
        run: |
          set -e
          git clone --depth 1 --recurse-submodules --shallow-submodules \
            https://github.com/leegao/SPIRV-Tools.git /tmp/SPIRV-Tools
          cd /tmp/SPIRV-Tools
          sed -i 's/ -Werror//g' Android.mk
          mkdir -p build/libs build/app jni
          printf 'LOCAL_PATH := $(call my-dir)\ninclude $(LOCAL_PATH)/../Android.mk\n' > jni/Android.mk
          NDK=/usr/local/lib/android/sdk/ndk/$(ls /usr/local/lib/android/sdk/ndk | grep '^27' | head -1)
          "$NDK/ndk-build" -j"$(nproc)" -C /tmp/SPIRV-Tools \
            NDK_PROJECT_PATH=/tmp/SPIRV-Tools \
            NDK_LIBS_OUT=/tmp/SPIRV-Tools/build/libs \
            NDK_APP_OUT=/tmp/SPIRV-Tools/build/app \
            APP_ABI=arm64-v8a APP_PLATFORM=android-24
          find /tmp/SPIRV-Tools/build -name '*.a'

      - name: Stage SPIRV-Tools into source
        run: |
          set -e
          mkdir -p src/vulkan/wrapper/lib
          rm -f src/vulkan/wrapper/lib/*.a
          if ls /tmp/SPIRV-Tools/build/app/local/arm64-v8a/*.a >/dev/null 2>&1; then
            cp /tmp/SPIRV-Tools/build/app/local/arm64-v8a/*.a src/vulkan/wrapper/lib/
          else
            cp /tmp/SPIRV-Tools/build/libs/arm64-v8a/*.a src/vulkan/wrapper/lib/
          fi
          rm -rf src/vulkan/wrapper/include/spirv-tools
          cp -r /tmp/SPIRV-Tools/include src/vulkan/wrapper/include/spirv-tools
          ls -la src/vulkan/wrapper/lib

      - name: Sanity check BCn patch
        run: grep -n "needs_bc1_emulation\|needs_bc4_emulation" src/vulkan/wrapper/wrapper_physical_device.c | head -20

      - name: Build in wrapper-compiler (API 24, no packed relocs)
        run: |
          set -e
          docker run --rm -v "$PWD:/workspace" --entrypoint bash \
            ghcr.io/leegao/mesa-wrapper-ci/wrapper-compiler:latest -c '
              set -e
              CF=/root/build-config/cross_file.txt
              Q=$(printf "\x27")
              sed -i "s#android30-clang#android24-clang#g" "$CF"
              sed -i "s#-landroid-shmem${Q}]#-landroid-shmem${Q}, ${Q}-Wl,--pack-dyn-relocs=none${Q}]#g" "$CF"
              echo "===== cross_file ====="
              cat "$CF"
              echo "======================"
              /root/build.sh build
              ls -la /workspace/build/libvulkan_wrapper.so*
            '

      - name: Verify ELF
        run: |
          set -e
          ls -la build/libvulkan_wrapper.so
          python3 - <<'EOF'
          import struct
          d=open('build/libvulkan_wrapper.so','rb').read()
          e_shoff=struct.unpack_from('<Q',d,40)[0]
          e_shentsize,e_shnum,e_shstrndx=struct.unpack_from('<HHH',d,58)
          shs=[struct.unpack_from('<IIQQQQ',d,e_shoff+i*e_shentsize) for i in range(e_shnum)]
          _,_,_,_,so,ss=shs[e_shstrndx]; blob=d[so:so+ss]
          names=[]
          for nm,typ,fl,addr,off,size in shs:
              end=blob.find(b'\0',nm); names.append(blob[nm:end].decode('latin1'))
          print('size', len(d))
          print('has .relr.dyn:', '.relr.dyn' in names)
          for nm,typ,fl,addr,off,size in shs:
              end=blob.find(b'\0',nm); name=blob[nm:end].decode('latin1')
              if name=='.note.android.ident':
                  namesz,descsz,ntype=struct.unpack_from('<III',d,off)
                  api=struct.unpack_from('<I',d,off+12+((namesz+3)//4)*4)[0]
                  print('target API level:', api)
          EOF

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: wrapper-api24
          path: |
            build/libvulkan_wrapper.so
            build/libvulkan_wrapper.so.unstripped
          if-no-files-found: error
