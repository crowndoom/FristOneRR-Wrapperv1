name: Build libvulkan_wrapper (aarch64 Android)

on:
  workflow_dispatch:
  push:
    branches: [ fristonerr-wrapper-v1 ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout wrapper source
        uses: actions/checkout@v4

      - name: Pick Android NDK
        id: ndk
        run: |
          set -e
          NDK_ROOT=/usr/local/lib/android/sdk/ndk
          echo "Available NDKs:"; ls -1 "$NDK_ROOT" 2>/dev/null || true
          if [ -d "$NDK_ROOT" ] && ls -d "$NDK_ROOT"/27.* >/dev/null 2>&1; then
            NDK="$(ls -d "$NDK_ROOT"/27.* | head -n1)"
          else
            NDK="$ANDROID_NDK_LATEST_HOME"
          fi
          echo "Using NDK: $NDK"
          echo "path=$NDK" >> "$GITHUB_OUTPUT"

      - name: Cache leegao SPIRV-Tools build
        uses: actions/cache@v4
        with:
          path: /tmp/SPIRV-Tools
          key: leegao-spirvtools-v1

      - name: Build leegao SPIRV-Tools (aarch64 static libs)
        env:
          NDK: ${{ steps.ndk.outputs.path }}
        run: |
          set -e
          LIBDIR=/tmp/SPIRV-Tools/build/app/local/arm64-v8a
          if ls "$LIBDIR"/*.a >/dev/null 2>&1; then
            echo "Using cached SPIRV-Tools build"
          else
            rm -rf /tmp/SPIRV-Tools
            git clone --depth 1 --recurse-submodules --shallow-submodules \
              https://github.com/leegao/SPIRV-Tools.git /tmp/SPIRV-Tools
            cd /tmp/SPIRV-Tools
            # leegao pins -Werror; relax it so newer clang does not fail the build.
            sed -i 's/ -Werror//g' Android.mk
            mkdir -p build/libs build/app jni
            printf 'LOCAL_PATH := $(call my-dir)\ninclude $(LOCAL_PATH)/../Android.mk\n' > jni/Android.mk
            "$NDK/ndk-build" -j"$(nproc)" \
              -C /tmp/SPIRV-Tools \
              NDK_PROJECT_PATH=/tmp/SPIRV-Tools \
              NDK_LIBS_OUT=/tmp/SPIRV-Tools/build/libs \
              NDK_APP_OUT=/tmp/SPIRV-Tools/build/app \
              APP_ABI=arm64-v8a \
              APP_PLATFORM=android-30
          fi
          echo "--- produced static libraries ---"
          find /tmp/SPIRV-Tools/build -name '*.a' -print

      - name: Stage SPIRV-Tools into wrapper tree
        run: |
          set -e
          mkdir -p src/vulkan/wrapper/lib
          rm -f src/vulkan/wrapper/lib/*.a
          if ls /tmp/SPIRV-Tools/build/app/local/arm64-v8a/*.a >/dev/null 2>&1; then
            cp /tmp/SPIRV-Tools/build/app/local/arm64-v8a/*.a src/vulkan/wrapper/lib/
          else
            cp /tmp/SPIRV-Tools/build/libs/arm64-v8a/*.a src/vulkan/wrapper/lib/
          fi
          rm -rf src/vulkan/wrapper/include/spirv-tools
          cp -r /tmp/SPIRV-Tools/include src/vulkan/wrapper/include/spirv-tools
          echo "--- staged ---"
          ls -la src/vulkan/wrapper/lib

      - name: Acquire wrapper-compiler image
        run: |
          set -e
          if docker pull ghcr.io/leegao/mesa-wrapper-ci/wrapper-compiler:latest; then
            echo "IMG=ghcr.io/leegao/mesa-wrapper-ci/wrapper-compiler:latest" >> "$GITHUB_ENV"
          else
            git clone --depth 1 https://github.com/FristOneRR-Admin/mesa-wrapper-CI.git _ci
            docker build -t wrapper-compiler _ci
            echo "IMG=wrapper-compiler" >> "$GITHUB_ENV"
          fi

      - name: Compile libvulkan_wrapper.so
        run: |
          docker run --rm -v "$GITHUB_WORKSPACE:/workspace" "$IMG" build

      - name: Fix ownership and list output
        run: |
          sudo chown -R "$(id -u):$(id -g)" build || true
          ls -la build

      - name: Upload stripped + unstripped wrapper
        uses: actions/upload-artifact@v4
        with:
          name: libvulkan_wrapper-aarch64
          path: |
            build/libvulkan_wrapper.so
            build/libvulkan_wrapper.so.unstripped
          if-no-files-found: error
